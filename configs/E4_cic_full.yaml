# E4: Dual-Agent NoHarness — Fine-tuned LLM + RF, no Consensus Module
# Dataset: CIC-IDS2017 Full

experiment:
  id: E4
  name: Ours-NoHarness
  description: "Dual-Agent (fine-tuned Alpha + RF Beta), Alpha result only (no verification loop)"
  dataset: cic_ids2017_full

data:
  base_dir: project/data/processed/cic_ids2017_full/zeroday_split
  train: train_known.csv
  val_known: val_known.csv
  val_zeroday: val_zeroday.csv
  text_col: text
  label_col: mc_label_name
  zeroday_classes: ["Bot", "WebAttack", "Infiltration"]

agent_alpha_hf:
  base_model: unsloth/Llama-3.2-3B-Instruct
  adapter_path: project/models/qlora_cic_full/adapter
  load_in_4bit: false
  temperature: 0.1
  max_new_tokens: 200
  max_input_length: 1024

agent_beta_ml:
  model_path: project/logs/E2_beta_ml_cic_full_model.pkl

mode: no_harness

sampling:
  pilot_n: 100
  subsample_n: 5000
  seed: 42

output:
  results_dir: project/results/tables
  logs_dir: project/logs
  prefix: E4_cic_full
