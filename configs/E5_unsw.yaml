# E5: SecHarness Full — Fine-tuned LLM + RF + Consensus Module + Observability
# Dataset: UNSW-NB15

experiment:
  id: E5
  name: Ours-SecHarness
  description: "Full SecHarness: Dual-Agent + Verification Loop + Audit Trail"
  dataset: unsw_nb15

data:
  base_dir: project/data/processed/unsw_nb15/zeroday_split
  train: train_known.csv
  val_known: val_known.csv
  val_zeroday: val_zeroday.csv
  text_col: text
  label_col: label_name
  zeroday_classes: ["Shellcode", "Worms"]

agent_alpha_hf:
  base_model: unsloth/Llama-3.2-3B-Instruct
  adapter_path: project/models/qlora_unsw/adapter
  load_in_4bit: false  # fp16 is faster on MPS (~2s vs 27s per sample)
  temperature: 0.1
  max_new_tokens: 150

agent_beta_ml:
  model_path: project/logs/E2_beta_ml_model.pkl

consensus:
  alpha_weight: 0.6
  beta_weight: 0.4
  disagreement_strategy: alpha_priority
  confidence_threshold: 0.4

sampling:
  pilot_n: 100
  subsample_n: 5000
  seed: 42

output:
  results_dir: project/results/tables
  logs_dir: project/logs
  prefix: E5_unsw
