experiment:
  id: E3_7B_ablation_full_unsw
  name: 'Ablation: full (7B)'
model:
  base: Qwen/Qwen2.5-7B-Instruct
  adapter: null
  load_in_4bit: false
  max_new_tokens: 256
  temperature: 0.1
harness:
  enabled: true
  tools:
    check_anomaly: true
    lookup_signature: true
    query_history: true
    load_knowledge: true
  permissions:
    enabled: true
    confidence_threshold: 0.3
  max_steps: 5
data:
  dataset: unsw
  split: val
  subsample: 200
  ml_model_path: project/logs/E2_beta_ml_model.pkl
output:
  log_dir: project/logs/v2/
  results_dir: project/results/tables/v2/
  prefix: E3_7B_ablation_full_unsw
