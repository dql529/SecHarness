experiment:
  id: lat_E1_unsw
  name: 'Latency baseline (same hardware): E1_unsw'
model:
  base: /root/autodl-tmp/models/unsloth-Llama-3.2-3B-Instruct
  adapter: null
  load_in_4bit: false
  max_new_tokens: 256
  temperature: 0.1
harness:
  enabled: false
  tools:
    check_anomaly: true
    lookup_signature: true
    query_history: true
    load_knowledge: true
  permissions:
    enabled: true
    confidence_threshold: 0.3
  max_steps: 5
data:
  dataset: unsw
  split: val
  subsample: 200
  ml_model_path: project/logs/E2_beta_ml_model.pkl
output:
  log_dir: project/logs/v2/
  results_dir: project/results/tables/v2/
  prefix: lat_E1_unsw
