experiment:
  id: E4_ablation_noActions_unsw
  name: 'Ablation: noActions (E4)'
model:
  base: unsloth/Llama-3.2-3B-Instruct
  adapter: project/models/qlora_unsw_v2_clean/adapter/
  load_in_4bit: false
  max_new_tokens: 256
  temperature: 0.1
harness:
  enabled: true
  tools:
    check_anomaly: true
    lookup_signature: true
    query_history: true
    load_knowledge: true
  permissions:
    enabled: true
    confidence_threshold: 0.3
  max_steps: 5
  actions:
    escalate: false
    log_decision: false
data:
  dataset: unsw
  split: val
  subsample: 200
  ml_model_path: project/logs/E2_beta_ml_model.pkl
output:
  log_dir: project/logs/v2/
  results_dir: project/results/tables/v2/
  prefix: E4_ablation_noActions_unsw
