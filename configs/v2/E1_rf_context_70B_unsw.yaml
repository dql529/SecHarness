# E1-RF-70B: Zero-shot 70B + No Harness + RF Context in Prompt (A800 vLLM)
# Critical comparison: if E3-70B > E1-RF-70B, harness loop matters at 70B scale
experiment:
  id: "E1_rf_context_70B_unsw"
  name: "Zero-shot 70B, No Harness, RF Context"

model:
  base: "api://localhost:8000/casperhansen/llama-3.3-70b-instruct-awq"
  adapter: null
  load_in_4bit: false
  max_new_tokens: 256
  temperature: 0.1

harness:
  enabled: false
  rf_context: true
  tools:
    check_anomaly: true
    lookup_signature: true
    query_history: true
    load_knowledge: true
  permissions:
    enabled: true
    confidence_threshold: 0.3
  max_steps: 5

data:
  dataset: "unsw"
  split: "val"
  subsample: null
  seed: 42
  ml_model_path: "project/logs/E2_beta_ml_model.pkl"

output:
  log_dir: "project/logs/v2/"
  results_dir: "project/results/tables/v2/"
