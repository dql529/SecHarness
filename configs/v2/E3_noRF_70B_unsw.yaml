# E3-noRF-70B: Llama-3.3-70B-AWQ + Harness Loop (NO RF tool)
# A800 vLLM backend — tests if largest model can compensate for missing RF
experiment:
  id: "E3_noRF_70B_unsw"
  name: "Zero-shot 70B + Harness, No RF Tool"

model:
  base: "api://localhost:8000/llama-3.3-70b-instruct-awq"
  adapter: null
  load_in_4bit: false
  max_new_tokens: 512
  temperature: 0.1

harness:
  enabled: true
  rf_context: false
  tools:
    check_anomaly: false
    lookup_signature: true
    query_history: true
    load_knowledge: true
  permissions:
    enabled: true
    confidence_threshold: 0.3
  max_steps: 5

data:
  dataset: "unsw"
  split: "val"
  subsample: null
  seed: 42
  ml_model_path: "project/logs/E2_beta_ml_model.pkl"

output:
  log_dir: "project/logs/v2/"
  results_dir: "project/results/tables/v2/"
