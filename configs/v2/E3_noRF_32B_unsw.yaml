# E3-noRF-32B: Qwen2.5-32B + Harness Loop (NO RF tool)
# Largest local model without RF — tests if model capability can compensate for missing ML tool
experiment:
  id: "E3_noRF_32B_unsw"
  name: "Zero-shot 32B + Harness, No RF Tool"

model:
  base: "api://localhost:11434/qwen2.5:32b"
  adapter: null
  load_in_4bit: false
  max_new_tokens: 512
  temperature: 0.1

harness:
  enabled: true
  rf_context: false
  tools:
    check_anomaly: false
    lookup_signature: true
    query_history: true
    load_knowledge: true
  permissions:
    enabled: true
    confidence_threshold: 0.3
  max_steps: 5

data:
  dataset: "unsw"
  split: "val"
  subsample: null
  seed: 42
  ml_model_path: "project/logs/E2_beta_ml_model.pkl"

output:
  log_dir: "project/logs/v2/"
  results_dir: "project/results/tables/v2/"
