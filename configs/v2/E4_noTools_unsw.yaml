# E4 Ablation: No check_anomaly + No lookup_signature
experiment:
  id: "E4_noTools_unsw"
  name: "Fine-tuned, SecHarness (no analysis tools)"

model:
  base: "unsloth/Llama-3.2-3B-Instruct"
  adapter: "project/models/qlora_unsw/adapter/"
  load_in_4bit: false
  max_new_tokens: 256
  temperature: 0.1

harness:
  enabled: true
  tools:
    check_anomaly: false
    lookup_signature: false
    query_history: true
    load_knowledge: true
  permissions:
    enabled: true
    confidence_threshold: 0.3
  max_steps: 5

data:
  dataset: "unsw"
  split: "val"
  subsample: null
  ml_model_path: "project/logs/E2_beta_ml_model.pkl"

output:
  log_dir: "project/logs/v2/"
  results_dir: "project/results/tables/v2/"
