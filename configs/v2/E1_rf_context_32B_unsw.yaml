# NOTE (audit 2026-07-28 / recorded 2026-08-19): NEVER RUN as a reported condition.
# AWQ twin with no sub-200 log; the reported 32B E1-RF condition is E1_rf_context_32B_local_unsw.yaml. Kept for provenance.
# E1-RF-32B: Zero-shot 32B + No Harness + RF Context in Prompt (A800 vLLM)
experiment:
  id: "E1_rf_context_32B_unsw"
  name: "Zero-shot 32B, No Harness, RF Context"

model:
  base: "api://localhost:8000/Qwen/Qwen2.5-32B-Instruct-AWQ"
  adapter: null
  load_in_4bit: false
  max_new_tokens: 256
  temperature: 0.1

harness:
  enabled: false
  rf_context: true
  tools:
    check_anomaly: true
    lookup_signature: true
    query_history: true
    load_knowledge: true
  permissions:
    enabled: true
    confidence_threshold: 0.3
  max_steps: 5

data:
  dataset: "unsw"
  split: "val"
  subsample: null
  seed: 42
  ml_model_path: "project/logs/E2_beta_ml_model.pkl"

output:
  log_dir: "project/logs/v2/"
  results_dir: "project/results/tables/v2/"
