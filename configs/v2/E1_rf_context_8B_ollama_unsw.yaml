# E1-RF-8B: Llama-3.1-8B (Ollama) + No Harness + RF Context
# Same family as 3B (Llama), controls architecture confound for within-family scaling
experiment:
  id: "E1_rf_context_8B_ollama_unsw"
  name: "Zero-shot 8B Llama, No Harness, RF Context"

model:
  base: "api://localhost:11434/llama3.1:8b"
  adapter: null
  load_in_4bit: false
  max_new_tokens: 256
  temperature: 0.1

harness:
  enabled: false
  rf_context: true
  tools:
    check_anomaly: true
    lookup_signature: true
    query_history: true
    load_knowledge: true
  permissions:
    enabled: true
    confidence_threshold: 0.3
  max_steps: 5

data:
  dataset: "unsw"
  split: "val"
  subsample: null
  seed: 42
  ml_model_path: "project/logs/E2_beta_ml_model.pkl"

output:
  log_dir: "project/logs/v2/"
  results_dir: "project/results/tables/v2/"
