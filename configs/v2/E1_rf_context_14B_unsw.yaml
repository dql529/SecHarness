# NOTE (audit 2026-07-28 / recorded 2026-08-19): NEVER RUN as a reported condition.
# HF-Transformers twin never run beyond an empty pilot; the reported 14B E1-RF condition is E1_rf_context_14B_ollama_unsw.yaml. Kept for provenance.
# E1-RF-14B: Qwen2.5-14B + No Harness + RF Context in Prompt
# Same family as 7B (Qwen), tests scaling within family
experiment:
  id: "E1_rf_context_14B_unsw"
  name: "Zero-shot 14B Qwen, No Harness, RF Context"

model:
  base: "Qwen/Qwen2.5-14B-Instruct"
  adapter: null
  load_in_4bit: false
  max_new_tokens: 256
  temperature: 0.1

harness:
  enabled: false
  rf_context: true
  tools:
    check_anomaly: true
    lookup_signature: true
    query_history: true
    load_knowledge: true
  permissions:
    enabled: true
    confidence_threshold: 0.3
  max_steps: 5

data:
  dataset: "unsw"
  split: "val"
  subsample: null
  seed: 42
  ml_model_path: "project/logs/E2_beta_ml_model.pkl"

output:
  log_dir: "project/logs/v2/"
  results_dir: "project/results/tables/v2/"
