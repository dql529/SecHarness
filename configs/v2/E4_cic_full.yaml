# E4: UNSW v2 adapter + SecHarness on CIC-IDS2017 Full (cross-dataset transfer)
experiment:
  id: "E4_cic_full"
  name: "UNSW-tuned, SecHarness (CIC Full)"

model:
  base: "unsloth/Llama-3.2-3B-Instruct"
  adapter: "project/models/qlora_cic_full/adapter/"
  load_in_4bit: false
  max_new_tokens: 256
  temperature: 0.1

harness:
  enabled: true
  tools:
    check_anomaly: true
    lookup_signature: true
    query_history: true
    load_knowledge: true
  permissions:
    enabled: true
    confidence_threshold: 0.3
  max_steps: 5

data:
  dataset: "cic_full"
  split: "val"
  subsample: null
  ml_model_path: "project/logs/E2_beta_ml_cic_full_model.pkl"

output:
  log_dir: "project/logs/v2/"
  results_dir: "project/results/tables/v2/"
