# E5-unsw-tdsc: Dual-Agent Pipeline on UNSW-NB15 (A800 HF+unsloth backend)
# Sanity check: confusion matrix must match the C12 reference within ±2pp for N=1000.
# Uses original v1 alpha_agent_hf path (unsloth + PEFT) — proven in paper.

experiment:
  id: E5_unsw_tdsc
  name: Ours-SecHarness-HF-UNSW
  description: "Dual-Agent (AlphaHF + BetaML) on UNSW-NB15; sanity check vs Registry C12"
  dataset: unsw_nb15

data:
  base_dir: project/data/processed/unsw_nb15/zeroday_split
  train: train_known.csv
  val_known: val_known.csv
  val_zeroday: val_zeroday.csv
  text_col: text
  label_col: label_name
  zeroday_classes: ["Shellcode", "Worms"]

agent_alpha_hf:
  base_model: unsloth/Llama-3.2-3B-Instruct
  adapter_path: project/models/qlora_unsw/adapter
  load_in_4bit: false
  temperature: 0.1
  max_new_tokens: 150
  device: cuda

agent_beta_ml:
  model_path: project/logs/E2_beta_ml_model.pkl

consensus:
  alpha_weight: 0.6
  beta_weight: 0.4
  disagreement_strategy: alpha_priority
  confidence_threshold: 0.4

sampling:
  pilot_n: 20
  subsample_n: 1000
  seeds: [42, 123, 456]

output:
  results_dir: project/results/tables/v2_tdsc/
  logs_dir: project/logs/v2_tdsc/
  prefix: E5_unsw_tdsc
